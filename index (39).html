<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Trạm Tín Hiệu — Cảng Quy Nhơn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#0B1E33;
    --navy-mid:#122B45;
    --navy-card:#16324F;
    --steel:#3C5876;
    --steel-soft:#5B7690;
    --fog:#EEF2F6;
    --white:#FFFFFF;
    --ink:#0E1E2E;
    --muted:#5B7186;
    --orange:#F4791F;
    --orange-deep:#D9640F;
    --green:#1FA97A;
    --red:#E0453F;
    --amber:#EDB13A;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;overflow-x:hidden;width:100%;max-width:100%;}
  body{font-family:'Inter',sans-serif;background:var(--fog);color:var(--ink);}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);}
  h1,h2,h3{font-family:'Oswald',sans-serif;margin:0;letter-spacing:.01em;}
  button{font-family:'Inter',sans-serif;cursor:pointer;border:none;}
  input,select{font-family:'Inter',sans-serif;}

  /* ---------- BEACON (signature element) ---------- */
  .beacon{position:relative;width:14px;height:14px;border-radius:50%;flex-shrink:0;}
  .beacon::after{content:'';position:absolute;inset:0;border-radius:50%;animation:pulse 1.8s ease-out infinite;}
  .beacon.green{background:var(--green);}
  .beacon.green::after{background:var(--green);}
  .beacon.red{background:var(--red);}
  .beacon.red::after{background:var(--red);}
  .beacon.gray{background:#8CA0B3;}
  .beacon.gray::after{display:none;}
  .beacon.amber{background:var(--amber);}
  .beacon.amber::after{background:var(--amber);}
  @keyframes pulse{
    0%{transform:scale(1);opacity:.7;}
    100%{transform:scale(2.6);opacity:0;}
  }

  /* ---------- LOGIN ---------- */
  #login-screen{min-height:100vh;background:radial-gradient(circle at 30% 20%, #16324F 0%, var(--navy-deep) 55%, #060F1A 100%);display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card{width:100%;max-width:380px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:36px 28px;backdrop-filter:blur(6px);}
  .login-head{display:flex;align-items:center;gap:12px;margin-bottom:6px;}
  .login-head .beacon{width:16px;height:16px;}
  .login-head h1{color:var(--white);font-size:22px;}
  .login-sub{color:#9FB4C8;font-size:13px;margin-top:6px;margin-bottom:28px;line-height:1.5;}
  .field{margin-bottom:16px;}
  #login-screen .field label{display:block;font-size:12px;color:#9FB4C8;margin-bottom:6px;font-family:'JetBrains Mono',monospace;letter-spacing:.04em;}
  #login-screen .field input{width:100%;padding:12px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:var(--white);font-size:15px;outline:none;transition:border-color .15s;}
  #login-screen .field input:focus{border-color:var(--orange);}
  #login-screen .field input::placeholder{color:#5B7690;}
  .role-toggle{display:flex;gap:8px;margin-bottom:18px;}
  .role-btn{flex:1;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,.14);background:transparent;color:#9FB4C8;font-size:13px;font-weight:600;transition:.15s;}
  .role-btn.active{background:var(--orange);border-color:var(--orange);color:var(--white);}
  .btn-primary{width:100%;padding:14px;border-radius:8px;background:var(--orange);color:var(--white);font-size:15px;font-weight:600;transition:background .15s;}
  .btn-primary:hover{background:var(--orange-deep);}
  .btn-primary:disabled{background:#4A5A6B;cursor:not-allowed;}
  .login-error{color:#FF8A80;font-size:12.5px;margin-top:12px;min-height:16px;}

  /* ---------- SHARED SHELL ---------- */
  .topbar{background:var(--navy-deep);color:var(--white);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:20;max-width:100%;}
  .topbar-id{display:flex;align-items:center;gap:10px;min-width:0;flex:1;overflow:hidden;}
  .topbar-id .name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topbar-id .code{font-family:'JetBrains Mono',monospace;font-size:11px;color:#9FB4C8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .btn-logout{background:transparent;color:#9FB4C8;font-size:12.5px;padding:8px 12px;border:1px solid rgba(255,255,255,.15);border-radius:6px;flex-shrink:0;white-space:nowrap;}
  .btn-logout:hover{color:var(--white);border-color:rgba(255,255,255,.35);}
  main{max-width:840px;margin:0 auto;padding:20px 16px 60px;width:100%;}

  /* ---------- GUARD VIEW ---------- */
  .section-title{display:flex;align-items:center;gap:8px;margin:26px 0 14px;}
  .section-title h2{font-size:17px;color:var(--ink);}
  .checkpoint-card{background:var(--white);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(14,30,46,.08);border:1px solid #E1E8EF;}
  .cp-head{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
  .cp-head h3{font-size:16px;}
  .cp-note{color:var(--muted);font-size:13px;margin:4px 0 10px;}
  .cp-last{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--steel-soft);margin-bottom:12px;}
  .btn-checkin{background:var(--navy-deep);color:var(--white);padding:12px 18px;border-radius:8px;font-size:14px;font-weight:600;width:100%;}
  .btn-checkin:hover{background:#0F2740;}
  .btn-checkin:disabled{background:#B7C2CC;}
  .btn-manual-toggle{background:transparent;color:var(--steel-soft);font-size:12px;padding:8px 0 0;width:100%;text-align:center;text-decoration:underline;}
  .manual-box{margin-top:10px;padding:12px;background:var(--fog);border-radius:8px;border:1px solid #E1E8EF;}
  .manual-hint{font-size:11.5px;color:var(--muted);margin-bottom:8px;line-height:1.5;}
  .manual-fields{display:flex;gap:8px;margin-bottom:8px;}
  .manual-fields input{flex:1;padding:9px 10px;border:1px solid #D4DDE5;border-radius:6px;font-size:13px;font-family:'JetBrains Mono',monospace;width:100%;}
  .btn-manual-submit{background:var(--orange);color:var(--white);padding:10px;border-radius:6px;font-size:13px;font-weight:600;width:100%;}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--white);padding:12px 20px;border-radius:8px;font-size:13.5px;max-width:90%;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:50;}
  .toast.ok{border-left:4px solid var(--green);}
  .toast.warn{border-left:4px solid var(--red);}
  .empty-state{text-align:center;padding:50px 20px;color:var(--muted);}

  /* ---------- SAFETY CHECKLIST ---------- */
  .btn-start-inspect{background:var(--orange);color:var(--white);padding:12px 18px;border-radius:8px;font-size:14px;font-weight:600;width:100%;}
  .btn-start-inspect:hover{background:var(--orange-deep);}
  .checklist-box{margin-top:14px;padding-top:10px;border-top:1px dashed #D4DDE5;}
  .safety-cat{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--orange);margin:14px 0 6px;}
  .safety-item{padding:10px 0;border-bottom:1px solid #EEF2F6;}
  .safety-item:last-child{border-bottom:none;}
  .safety-item-label{font-size:13.5px;margin-bottom:8px;line-height:1.4;}
  .safety-answer-btns{display:flex;gap:8px;}
  .btn-pass,.btn-fail{flex:1;padding:8px;border-radius:6px;border:1px solid #D4DDE5;background:var(--white);color:var(--muted);font-size:12.5px;font-weight:600;}
  .btn-pass.selected{background:#E4F5EE;border-color:var(--green);color:var(--green);}
  .btn-fail.selected{background:#FCEAE9;border-color:var(--red);color:var(--red);}
  .fail-detail{margin-top:8px;padding:10px;background:var(--fog);border-radius:6px;}
  .fail-detail label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;}
  .fail-detail select,.fail-detail textarea{width:100%;padding:8px;border:1px solid #D4DDE5;border-radius:6px;font-size:12.5px;margin-bottom:8px;font-family:'Inter',sans-serif;resize:vertical;}
  .btn-submit-inspect{background:var(--navy-deep);color:var(--white);padding:12px;border-radius:8px;font-size:14px;font-weight:600;width:100%;margin-top:14px;}
  .btn-submit-inspect:disabled{background:#B7C2CC;}
  .checklist-validation{color:var(--red);font-size:12px;margin-top:8px;text-align:center;}
  .sev-badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
  .sev-badge.sev-thap{background:#FFF4DE;color:#B8860B;}
  .sev-badge.sev-trungbinh{background:#FDE8D0;color:#C1590C;}
  .sev-badge.sev-cao{background:#FCEAE9;color:var(--red);}
  .violation-row{padding:12px 0;border-bottom:1px solid #EEF2F6;}
  .violation-row:last-child{border-bottom:none;}
  .violation-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;gap:10px;}
  .violation-meta{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--steel-soft);margin-bottom:6px;}
  .violation-note{font-size:13px;color:var(--ink);margin-bottom:8px;}
  .btn-resolve{background:var(--fog);color:var(--ink);border:1px solid #D4DDE5;padding:6px 12px;border-radius:6px;font-size:12px;}
  .btn-resolve:hover{background:#E4F5EE;border-color:var(--green);color:var(--green);}
  .crit-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #EEF2F6;font-size:13px;gap:10px;}
  .crit-row:last-child{border-bottom:none;}

  /* ---------- MANAGER VIEW ---------- */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;}
  .stat-card{background:var(--white);border-radius:var(--radius);padding:16px;border:1px solid #E1E8EF;}
  .stat-card .num{font-family:'Oswald',sans-serif;font-size:28px;color:var(--navy-deep);}
  .stat-card .lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
  .panel{background:var(--white);border-radius:var(--radius);border:1px solid #E1E8EF;padding:18px;margin-top:20px;}
  .panel h2{font-size:16px;margin-bottom:14px;}
  .form-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;align-items:end;}
  .form-grid .field{margin-bottom:0;}
  .form-grid label{font-size:11px;color:var(--muted);}
  .form-grid input{padding:9px 10px;border:1px solid #D4DDE5;border-radius:6px;font-size:13.5px;width:100%;color:var(--ink);background:var(--white);}
  .btn-add{grid-column:1/-1;background:var(--orange);color:var(--white);padding:10px;border-radius:6px;font-size:13.5px;font-weight:600;margin-top:4px;}
  .btn-geo{background:var(--fog);color:var(--ink);border:1px solid #D4DDE5;padding:9px;border-radius:6px;font-size:12px;grid-column:1/-1;margin-bottom:4px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:8px 10px;border-bottom:2px solid #E1E8EF;}
  td{padding:9px 10px;border-bottom:1px solid #EEF2F6;font-family:'JetBrains Mono',monospace;font-size:12.5px;}
  td.name-cell{font-family:'Inter',sans-serif;}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
  .pill.ok{background:#E4F5EE;color:var(--green);}
  .pill.warn{background:#FCEAE9;color:var(--red);}
  .cp-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #EEF2F6;font-size:13.5px;}
  .cp-row:last-child{border-bottom:none;}
  .cp-row .meta{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:11px;}
  .btn-del{background:transparent;color:var(--red);font-size:12px;padding:4px 8px;}
  .filter-row{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  .filter-row select,.filter-row input{padding:7px 10px;border:1px solid #D4DDE5;border-radius:6px;font-size:12.5px;}
  .btn-export{background:var(--navy-deep);color:var(--white);padding:7px 14px;border-radius:6px;font-size:12.5px;margin-left:auto;}
  .table-wrap{overflow-x:auto;}

  @media(max-width:640px){
    .form-grid{grid-template-columns:1fr 1fr;}
    table{font-size:11.5px;}
  }
</style>
</head>
<body>

<div id="app"></div>

<script>
/* ================= STATE ================= */
const MANAGER_PIN = "QLTC2026"; // Mã PIN quản lý — anh Hùng có thể đổi trực tiếp trong code tại dòng này
const DEFAULT_SAFETY_CRITERIA = [
  {id:'sc_1', category:'ATLĐ', label:'Người lao động có đầy đủ trang bị bảo hộ (mũ, giày, áo phản quang)'},
  {id:'sc_2', category:'ATLĐ', label:'Khu vực làm việc có biển cảnh báo an toàn đầy đủ'},
  {id:'sc_3', category:'ATLĐ', label:'Thiết bị nâng hạ, cẩu có kiểm định còn hiệu lực'},
  {id:'sc_4', category:'ATLĐ', label:'Lối đi, lối thoát hiểm không bị cản trở'},
  {id:'sc_5', category:'ATLĐ', label:'Có đủ ánh sáng tại khu vực làm việc'},
  {id:'sc_6', category:'PCCC', label:'Bình chữa cháy còn hạn sử dụng, đủ áp lực'},
  {id:'sc_7', category:'PCCC', label:'Hệ thống báo cháy hoạt động bình thường'},
  {id:'sc_8', category:'PCCC', label:'Lối thoát hiểm, cửa thoát hiểm không bị khóa/chặn'},
  {id:'sc_9', category:'PCCC', label:'Không có vật liệu dễ cháy để gần nguồn nhiệt/nguồn điện'},
  {id:'sc_10', category:'PCCC', label:'Bảng nội quy PCCC được niêm yết đầy đủ'}
];
let state = {
  view: 'login',
  role: null,        // 'guard' | 'safety' | 'manager'
  empCode: '',
  empName: '',
  checkpoints: [],
  checkins: [],
  safetyCriteria: [],
  safetyInspections: [],
  loading: true,
  toast: null,
  pollHandle: null
};

const app = document.getElementById('app');

/* ================= STORAGE HELPERS ================= */
async function loadData(){
  try{
    const cp = await window.storage.get('checkpoints', true);
    state.checkpoints = cp ? JSON.parse(cp.value) : [];
  }catch(e){ state.checkpoints = []; }
  try{
    const ci = await window.storage.get('checkins', true);
    state.checkins = ci ? JSON.parse(ci.value) : [];
  }catch(e){ state.checkins = []; }
  try{
    const sc = await window.storage.get('safety-criteria', true);
    if(sc){ state.safetyCriteria = JSON.parse(sc.value); }
    else { state.safetyCriteria = DEFAULT_SAFETY_CRITERIA; await saveSafetyCriteria(); }
  }catch(e){ state.safetyCriteria = DEFAULT_SAFETY_CRITERIA; }
  try{
    const si = await window.storage.get('safety-inspections', true);
    state.safetyInspections = si ? JSON.parse(si.value) : [];
  }catch(e){ state.safetyInspections = []; }
}
async function saveCheckpoints(){
  await window.storage.set('checkpoints', JSON.stringify(state.checkpoints), true);
}
async function saveCheckins(){
  await window.storage.set('checkins', JSON.stringify(state.checkins), true);
}
async function saveSafetyCriteria(){
  await window.storage.set('safety-criteria', JSON.stringify(state.safetyCriteria), true);
}
async function saveSafetyInspections(){
  await window.storage.set('safety-inspections', JSON.stringify(state.safetyInspections), true);
}

/* ================= UTIL ================= */
function haversine(lat1,lon1,lat2,lon2){
  const R=6371000, toRad=x=>x*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function fmtTime(iso){
  const d=new Date(iso);
  return d.toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
}
function isToday(iso){
  const d=new Date(iso), t=new Date();
  return d.toDateString()===t.toDateString();
}
function showToast(msg, type){
  state.toast = {msg, type};
  render();
  setTimeout(()=>{ state.toast=null; render(); }, 3200);
}
function lastCheckinFor(cpId){
  const list = state.checkins.filter(c=>c.checkpointId===cpId).sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
  return list[0] || null;
}
function sevSlug(sev){
  if(sev==='Trung bình') return 'sev-trungbinh';
  if(sev==='Cao') return 'sev-cao';
  return 'sev-thap';
}
function roleLabel(role){
  return role==='manager' ? 'Quản lý' : role==='safety' ? 'An toàn ATLĐ-PCCC' : 'Bảo vệ';
}

/* ================= LOGIN ================= */
function renderLogin(){
  app.innerHTML = `
  <div id="login-screen">
    <div class="login-card">
      <div class="login-head">
        <div class="beacon amber"></div>
        <h1>Trạm Tín Hiệu</h1>
      </div>
      <div class="eyebrow">Cảng Quy Nhơn · TCHC</div>
      <div class="login-sub">Check-in vị trí tuần tra bảo vệ bằng định vị GPS. Đăng nhập bằng mã nhân viên nội bộ để bắt đầu.</div>

      <div class="role-toggle">
        <button class="role-btn ${(!state._loginRole||state._loginRole==='guard')?'active':''}" id="role-guard">Bảo vệ</button>
        <button class="role-btn ${state._loginRole==='safety'?'active':''}" id="role-safety">An toàn</button>
        <button class="role-btn ${state._loginRole==='manager'?'active':''}" id="role-manager">Quản lý</button>
      </div>

      <div class="field">
        <label>Mã nhân viên</label>
        <input id="in-code" placeholder="VD: CQN01188" autocomplete="off">
      </div>
      <div class="field">
        <label>Họ tên</label>
        <input id="in-name" placeholder="VD: Nguyễn Văn A" autocomplete="off">
      </div>
      ${state._loginRole==='manager' ? `
      <div class="field">
        <label>Mã PIN quản lý</label>
        <input id="in-pin" type="password" placeholder="Nhập mã PIN">
      </div>` : ''}

      <button class="btn-primary" id="btn-login">Vào hệ thống</button>
      <div class="login-error">${state._loginError||''}</div>
    </div>
  </div>`;

  document.getElementById('role-guard').onclick = ()=>{ state._loginRole='guard'; renderLogin(); };
  document.getElementById('role-safety').onclick = ()=>{ state._loginRole='safety'; renderLogin(); };
  document.getElementById('role-manager').onclick = ()=>{ state._loginRole='manager'; renderLogin(); };
  document.getElementById('btn-login').onclick = doLogin;
}

function doLogin(){
  const code = document.getElementById('in-code').value.trim();
  const name = document.getElementById('in-name').value.trim();
  const role = state._loginRole || 'guard';
  if(!code || !name){ state._loginError='Vui lòng nhập đầy đủ mã nhân viên và họ tên.'; renderLogin(); return; }
  if(role==='manager'){
    const pin = document.getElementById('in-pin').value.trim();
    if(pin !== MANAGER_PIN){ state._loginError='Mã PIN quản lý không đúng.'; renderLogin(); return; }
  }
  state.empCode = code;
  state.empName = name;
  state.role = role;
  state.view = role;
  state._loginError = '';
  startApp();
}

/* ================= GUARD VIEW ================= */
function renderGuard(){
  const cards = state.checkpoints.length ? state.checkpoints.map(cp=>{
    const last = lastCheckinFor(cp.id);
    let dotClass='gray', lastText='Chưa có lượt check-in nào';
    if(last){
      dotClass = last.status==='ontime' ? 'green' : 'red';
      lastText = `${fmtTime(last.timestamp)} · ${last.empName} · ${last.status==='ontime'?'đúng vị trí':'lệch '+last.distance+'m'}`;
    }
    const manualOpen = state._manualFor === cp.id;
    return `
    <div class="checkpoint-card">
      <div class="cp-head"><div class="beacon ${dotClass}"></div><h3>${cp.name}</h3></div>
      ${cp.note ? `<div class="cp-note">${cp.note}</div>` : ''}
      <div class="cp-last">Gần nhất: ${lastText}</div>
      <button class="btn-checkin" data-cpid="${cp.id}">Check-in tại đây (GPS tự động)</button>
      <button class="btn-manual-toggle" data-cpid="${cp.id}">${manualOpen ? 'Ẩn nhập tọa độ thủ công' : 'GPS không hoạt động? Nhập tọa độ thủ công'}</button>
      ${manualOpen ? `
        <div class="manual-box">

async function recordCheckin(cpId, latitude, longitude){
  await loadData(); // đọc dữ liệu mới nhất trước khi ghi, tránh ghi đè
  const cp = state.checkpoints.find(c=>c.id===cpId);
  if(!cp){ showToast('Trạm này vừa bị xóa khỏi hệ thống.', 'warn'); renderGuard(); return; }
  const dist = Math.round(haversine(latitude, longitude, cp.lat, cp.lng));
  const status = dist <= cp.radius ? 'ontime' : 'deviated';
  const record = {
    id: 'ci_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    checkpointId: cp.id,
    checkpointName: cp.name,
    empCode: state.empCode,
    empName: state.empName,
    timestamp: new Date().toISOString(),
    lat: latitude, lng: longitude,
    distance: dist,
    status
  };
  state.checkins.push(record);
  await saveCheckins();
  state._manualFor = null;
  if(status==='ontime'){
    showToast(`Đã check-in "${cp.name}" — cách trạm ${dist}m.`, 'ok');
  }else{
    showToast(`Check-in "${cp.name}" nhưng vị trí lệch ${dist}m (ngoài phạm vi ${cp.radius}m cho phép).`, 'warn');
  }
  renderGuard();
}

function doCheckin(cpId, btn){
  if(!navigator.geolocation){
    showToast('Trình duyệt không cấp quyền định vị GPS ở đây. Dùng "Nhập tọa độ thủ công" bên dưới.', 'warn');
    state._manualFor = cpId; renderGuard(); return;
  }
  btn.disabled = true;
  btn.textContent = 'Đang lấy vị trí...';
  navigator.geolocation.getCurrentPosition(async (pos)=>{
    await recordCheckin(cpId, pos.coords.latitude, pos.coords.longitude);
  }, (err)=>{
    let msg = 'Không lấy được vị trí GPS. Dùng "Nhập tọa độ thủ công" bên dưới.';
    if(err.code === err.PERMISSION_DENIED) msg = 'Trình duyệt/khung xem này chặn quyền định vị GPS. Dùng "Nhập tọa độ thủ công" bên dưới.';
    else if(err.code === err.TIMEOUT) msg = 'Lấy vị trí GPS quá thời gian chờ. Dùng "Nhập tọa độ thủ công" bên dưới.';
    showToast(msg, 'warn');
    state._manualFor = cpId;
    renderGuard();
  }, {enableHighAccuracy:true, timeout:15000});
}

function submitManualCheckin(cpId){
  const latEl = document.getElementById('man-lat-'+cpId);
  const lngEl = document.getElementById('man-lng-'+cpId);
  const lat = parseFloat(latEl.value.trim());
  const lng = parseFloat(lngEl.value.trim());
  if(isNaN(lat) || isNaN(lng)){ showToast('Vui lòng nhập đủ vĩ độ và kinh độ hợp lệ.', 'warn'); return; }
  recordCheckin(cpId, lat, lng);
}

    if(last){
      dotClass = openViolations>0 ? 'red' : 'green';
      lastText = `${fmtTime(last.timestamp)} · ${last.empName} · ${openViolations>0 ? openViolations+' vi phạm chưa khắc phục' : 'đạt tất cả tiêu chí'}`;
    }
    const inspecting = state._safetyOpenFor === cp.id;
    const answers = state._safetyAnswers && state._safetyAnswers[cp.id] || {};

    let checklistHtml = '';
    if(inspecting){
      const cats = ['ATLĐ','PCCC'];

        const items = state.safetyCriteria.filter(c=>c.category===cat);
        if(!items.length) return '';
        return `<div class="safety-cat">${cat}</div>` + items.map(it=>{
          const ans = answers[it.id];

          <div class="safety-item">
            <div class="safety-item-label">${it.label}</div>
            <div class="safety-answer-btns">
              <button class="btn-pass ${ans==='pass'?'selected':''}" data-cpid="${cp.id}" data-critid="${it.id}" data-ans="pass">Đạt</button>
              <button class="btn-fail ${ans==='fail'?'selected':''}" data-cpid="${cp.id}" data-critid="${it.id}" data-ans="fail">Không đạt</button>
            </div>
            ${ans==='fail' ? `
            <div class="fail-detail">
              <label>Mức độ nghiêm trọng</label>
              <select id="sf-sev-${cp.id}-${it.id}">
                <option value="Thấp">Thấp</option>
                <option value="Trung bình">Trung bình</option>
                <option value="Cao">Cao</option>

              <label>Ghi chú / mô tả bất thường</label>
              <textarea id="sf-note-${cp.id}-${it.id}" rows="2" placeholder="VD: Bình chữa cháy hết hạn từ 03/2026"></textarea>
            </div>` : ''}

        }).join('');
      }).join('') + `
      <button class="btn-submit-inspect" data-cpid="${cp.id}" id="btn-submit-${cp.id}">Hoàn tất kiểm tra (xác nhận vị trí GPS)</button>
      <button class="btn-manual-toggle" data-cpid="sf_${cp.id}">${manualOpen ? 'Ẩn nhập tọa độ thủ công' : 'GPS không hoạt động? Nhập tọa độ thủ công'}</button>
      ${manualOpen ? `
        <div class="manual-box">
          <div class="manual-hint">Mở Google Maps → giữ ngón tay vào vị trí đang đứng → chạm vào tọa độ hiện lên ở dưới cùng để sao chép → dán vào đây.</div>
          <div class="manual-fields">
            <input id="man-lat-sf-${cp.id}" placeholder="Vĩ độ (VD: 13.782451)">
            <input id="man-lng-sf-${cp.id}" placeholder="Kinh độ (VD: 109.223110)">
          </div>
          <button class="btn-manual-submit" data-cpid="${cp.id}" id="btn-manual-submit-sf-${cp.id}">Xác nhận vị trí & hoàn tất kiểm tra</button>
        </div>
      ` : ''}
      ${state._safetyValidation ? `<div class="checklist-validation">${state._safetyValidation}</div>` : ''}

    }

    return `

    btn.onclick = ()=>{ state._manualFor = state._manualFor===btn.dataset.cpid ? null : btn.dataset.cpid; renderSafety(); };

    btn.onclick = ()=> submitManualSafetyInspection(btn.dataset.cpid);
  });
}

function validateSafetyAnswers(cpId){
  const answers = state._safetyAnswers[cpId] || {};
  const missing = state.safetyCriteria.filter(c=>!answers[c.id]);
  if(missing.length){
    state._safetyValidation = `Còn ${missing.length} tiêu chí chưa được đánh giá. Vui lòng chọn Đạt/Không đạt cho tất cả.`;
    renderSafety();
    return false;
  }
  for(const c of state.safetyCriteria){
    if(answers[c.id]==='fail'){
      const noteEl = document.getElementById(`sf-note-${cpId}-${c.id}`);
      if(noteEl && !noteEl.value.trim()){
        state._safetyValidation = `Vui lòng ghi chú mô tả bất thường cho tiêu chí "${c.label}".`;
        renderSafety();
        return false;
      }
    }
  }
  state._safetyValidation = null;
  return true;
}

function buildSafetyResults(cpId){
  const answers = state._safetyAnswers[cpId];
  return state.safetyCriteria.map(c=>{
    const ans = answers[c.id];
    const pass = ans==='pass';
    let severity=null, note='';
    if(!pass){
      const sevEl = document.getElementById(`sf-sev-${cpId}-${c.id}`);
      const noteEl = document.getElementById(`sf-note-${cpId}-${c.id}`);
      severity = sevEl ? sevEl.value : 'Thấp';
      note = noteEl ? noteEl.value.trim() : '';
    }
    return { criteriaId:c.id, category:c.category, label:c.label, pass, severity, note, resolved:false, resolvedAt:null };
  });
}

async function recordSafetyInspection(cpId, latitude, longitude){
  const results = buildSafetyResults(cpId);
  await loadData();
  const cp = state.checkpoints.find(c=>c.id===cpId);
  if(!cp){ showToast('Trạm này vừa bị xóa khỏi hệ thống.', 'warn'); renderSafety(); return; }
  const dist = Math.round(haversine(latitude, longitude, cp.lat, cp.lng));
  const status = dist <= cp.radius ? 'ontime' : 'deviated';
  const failCount = results.filter(r=>!r.pass).length;
  const record = {
    id: 'si_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    checkpointId: cp.id,
    checkpointName: cp.name,
    empCode: state.empCode,
    empName: state.empName,
    timestamp: new Date().toISOString(),
    lat: latitude, lng: longitude,
    distance: dist,
    status,
    results
  };
  state.safetyInspections.push(record);
  await saveSafetyInspections();
  state._safetyOpenFor = null;
  state._manualFor = null;
  if(failCount===0){
    showToast(`Đã hoàn tất kiểm tra "${cp.name}" — đạt tất cả tiêu chí.`, 'ok');
  }else{
    showToast(`Đã ghi nhận kiểm tra "${cp.name}" — phát hiện ${failCount} tiêu chí không đạt.`, 'warn');
  }
  renderSafety();
}

function submitSafetyChecklist(cpId, btn){
  if(!validateSafetyAnswers(cpId)) return;
  if(!navigator.geolocation){
    showToast('Trình duyệt không cấp quyền định vị GPS ở đây. Dùng "Nhập tọa độ thủ công" bên dưới.', 'warn');
    state._manualFor = 'sf_'+cpId; renderSafety(); return;
  }
  btn.disabled = true;
  btn.textContent = 'Đang lấy vị trí...';
  navigator.geolocation.getCurrentPosition(async (pos)=>{
    await recordSafetyInspection(cpId, pos.coords.latitude, pos.coords.longitude);
  }, (err)=>{
    let msg = 'Không lấy được vị trí GPS. Dùng "Nhập tọa độ thủ công" bên dưới.';
    if(err.code === err.PERMISSION_DENIED) msg = 'Trình duyệt/khung xem này chặn quyền định vị GPS. Dùng "Nhập tọa độ thủ công" bên dưới.';
    else if(err.code === err.TIMEOUT) msg = 'Lấy vị trí GPS quá thời gian chờ. Dùng "Nhập tọa độ thủ công" bên dưới.';
    showToast(msg, 'warn');
    state._manualFor = 'sf_'+cpId;
    renderSafety();
  }, {enableHighAccuracy:true, timeout:15000});
}

function submitManualSafetyInspection(cpId){
  if(!validateSafetyAnswers(cpId)) return;
  const latEl = document.getElementById('man-lat-sf-'+cpId);
  const lngEl = document.getElementById('man-lng-sf-'+cpId);
  const lat = parseFloat(latEl.value.trim());
  const lng = parseFloat(lngEl.value.trim());
  if(isNaN(lat) || isNaN(lng)){ showToast('Vui lòng nhập đủ vĩ độ và kinh độ hợp lệ.', 'warn'); return; }
  recordSafetyInspection(cpId, lat, lng);
}

    </div>

    <div class="panel">
      <h2>Tiêu chí kiểm tra ATLĐ-PCCC (dùng chung toàn cảng)</h2>
      <div class="form-grid" style="grid-template-columns:2fr 1fr;">
        <div class="field"><label>Nội dung tiêu chí</label><input id="sc-label" placeholder="VD: Có đủ bình chữa cháy tại khu vực"></div>
        <div class="field"><label>Nhóm</label>
          <select id="sc-category" style="width:100%;padding:9px 10px;border:1px solid #D4DDE5;border-radius:6px;font-size:13.5px;">
            <option value="ATLĐ">ATLĐ</option>
            <option value="PCCC">PCCC</option>
          </select>
        </div>
        <button class="btn-add" id="btn-add-sc">+ Thêm tiêu chí</button>
      </div>
      <div style="margin-top:14px;">
        <div class="safety-cat">ATLĐ</div>
        ${state.safetyCriteria.filter(c=>c.category==='ATLĐ').map(c=>`
          <div class="crit-row"><div>${c.label}</div><button class="btn-del" data-delsc="${c.id}">Xóa</button></div>
        `).join('') || '<div style="color:var(--muted);font-size:13px;padding:6px 0;">Chưa có tiêu chí ATLĐ.</div>'}
        <div class="safety-cat">PCCC</div>
        ${state.safetyCriteria.filter(c=>c.category==='PCCC').map(c=>`
          <div class="crit-row"><div>${c.label}</div><button class="btn-del" data-delsc="${c.id}">Xóa</button></div>
        `).join('') || '<div style="color:var(--muted);font-size:13px;padding:6px 0;">Chưa có tiêu chí PCCC.</div>'}
      </div>
    </div>

    <div class="panel">
      <h2>Vi phạm ATLĐ-PCCC đang mở (${openViolations.length})</h2>
      ${openViolations.length ? openViolations.map(v=>`
        <div class="violation-row">
          <div class="violation-top">
            <div><strong>${v.checkpointName}</strong> — ${v.label}</div>
            <span class="sev-badge ${sevSlug(v.severity)}">${v.severity}</span>
          </div>
          <div class="violation-meta">${fmtTime(v.timestamp)} · phát hiện bởi ${v.empName} (${v.empCode})</div>
          ${v.note ? `<div class="violation-note">${v.note}</div>` : ''}
          <button class="btn-resolve" data-resolve-insp="${v.inspId}" data-resolve-crit="${v.criteriaId}">Đánh dấu đã khắc phục</button>
        </div>
      `).join('') : '<div style="color:var(--muted);font-size:13px;">Không có vi phạm nào đang mở.</div>'}
    </div>

    <div class="panel">
      <h2>Nhật ký kiểm tra ATLĐ-PCCC</h2>
      <div class="filter-row">
        <select id="safety-filter-cp">
          <option value="all">Tất cả trạm</option>
          ${state.checkpoints.map(cp=>`<option value="${cp.id}" ${safetyFilterCp===cp.id?'selected':''}>${cp.name}</option>`).join('')}
        </select>
        <button class="btn-export" id="btn-export-safety">Xuất CSV</button>
      </div>
      <div class="table-wrap">
      <table>
        <thead><tr><th>Thời gian</th><th>Mã NV</th><th>Tên</th><th>Trạm</th><th>Đạt/Tổng</th><th>Vị trí</th></tr></thead>
        <tbody>
          ${safetyLogRows.map(i=>{
            const passCount = i.results.filter(r=>r.pass).length;
            const total = i.results.length;
            return `
            <tr>
              <td>${fmtTime(i.timestamp)}</td>
              <td>${i.empCode}</td>
              <td class="name-cell">${i.empName}</td>
              <td class="name-cell">${i.checkpointName}</td>
              <td><span class="pill ${passCount===total?'ok':'warn'}">${passCount}/${total}</span></td>
              <td>${i.status==='ontime'?'Đúng vị trí':'Lệch '+i.distance+'m'}</td>
            </tr>`;
          }).join('') || `<tr><td colspan="6" style="text-align:center;color:var(--muted);font-family:Inter;">Chưa có dữ liệu kiểm tra ATLĐ-PCCC.</td></tr>`}
        </tbody>
      </table>
      </div>
    </div>
  </main>
  ${state.toast ? `<div class="toast ${state.toast.type}">${state.toast.msg}</div>` : ''}
  `;

  document.getElementById('btn-logout').onclick = logout;
  document.getElementById('btn-geo').onclick = fillCurrentGeo;
  document.getElementById('btn-add-cp').onclick = addCheckpoint;
  document.querySelectorAll('[data-delcp]').forEach(b=>{
    b.onclick = ()=> deleteCheckpoint(b.dataset.delcp);
  });
  document.getElementById('filter-cp').onchange = (e)=>{ state._filterCp=e.target.value; renderManager(); };
  document.getElementById('filter-date').onchange = (e)=>{ state._filterDate=e.target.value; renderManager(); };
  document.getElementById('btn-export').onclick = exportCSV;

  document.getElementById('btn-add-sc').onclick = addSafetyCriteria;
  document.querySelectorAll('[data-delsc]').forEach(b=>{
    b.onclick = ()=> deleteSafetyCriteria(b.dataset.delsc);
  });
  document.querySelectorAll('[data-resolve-insp]').forEach(b=>{
    b.onclick = ()=> resolveViolation(b.dataset.resolveInsp, b.dataset.resolveCrit);
  });
  document.getElementById('safety-filter-cp').onchange = (e)=>{ state._safetyFilterCp=e.target.value; renderManager(); };
  document.getElementById('btn-export-safety').onclick = exportSafetyCSV;
}

async function addSafetyCriteria(){
  const label = document.getElementById('sc-label').value.trim();
  const category = document.getElementById('sc-category').value;
  if(!label){ showToast('Vui lòng nhập nội dung tiêu chí.', 'warn'); return; }
  await loadData();
  state.safetyCriteria.push({ id:'sc_'+Date.now()+'_'+Math.random().toString(36).slice(2,7), category, label });
  await saveSafetyCriteria();
  showToast('Đã thêm tiêu chí kiểm tra.', 'ok');
  renderManager();
}

async function deleteSafetyCriteria(id){
  await loadData();
  state.safetyCriteria = state.safetyCriteria.filter(c=>c.id!==id);
  await saveSafetyCriteria();
  renderManager();
}

async function resolveViolation(inspId, critId){
  await loadData();
  const insp = state.safetyInspections.find(i=>i.id===inspId);
  if(!insp){ renderManager(); return; }
  const result = insp.results.find(r=>r.criteriaId===critId);
  if(result){ result.resolved = true; result.resolvedAt = new Date().toISOString(); result.resolvedBy = state.empName; }
  await saveSafetyInspections();
  showToast('Đã đánh dấu vi phạm là đã khắc phục.', 'ok');
  renderManager();
}

function exportSafetyCSV(){
  const rows = [['Thời gian','Mã NV','Tên','Trạm','Nhóm','Tiêu chí','Kết quả','Mức độ','Ghi chú','Đã khắc phục']];
  state.safetyInspections.forEach(i=>{
    i.results.forEach(r=>{
      rows.push([fmtTime(i.timestamp), i.empCode, i.empName, i.checkpointName, r.category, r.label, r.pass?'Đạt':'Không đạt', r.severity||'', r.note||'', r.pass?'':(r.resolved?'Đã khắc phục':'Chưa khắc phục')]);
    });
  });
  const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `kiemtra-atld-pccc-QNP-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function fillCurrentGeo(){
  if(!navigator.geolocation){
    showToast('Khung xem này chặn định vị GPS. Mở Google Maps, giữ ngón tay vào vị trí đang đứng, chạm vào tọa độ để sao chép, rồi dán trực tiếp vào 2 ô Vĩ độ/Kinh độ bên dưới.', 'warn');
    return;
  }
  showToast('Đang lấy vị trí hiện tại...', 'ok');
  navigator.geolocation.getCurrentPosition(pos=>{
    document.getElementById('cp-lat').value = pos.coords.latitude.toFixed(6);
    document.getElementById('cp-lng').value = pos.coords.longitude.toFixed(6);
  }, ()=>{
    showToast('Khung xem này chặn định vị GPS. Mở Google Maps, giữ ngón tay vào vị trí đang đứng, chạm vào tọa độ để sao chép, rồi dán trực tiếp vào 2 ô Vĩ độ/Kinh độ bên dưới.', 'warn');
  }, {enableHighAccuracy:true, timeout:15000});
}

async function addCheckpoint(){
  const name = document.getElementById('cp-name').value.trim();
  const lat = parseFloat(document.getElementById('cp-lat').value);
  const lng = parseFloat(document.getElementById('cp-lng').value);
  const radius = parseInt(document.getElementById('cp-radius').value) || 50;
  const note = document.getElementById('cp-note').value.trim();
  if(!name || isNaN(lat) || isNaN(lng)){ showToast('Vui lòng nhập đủ tên trạm, vĩ độ và kinh độ.', 'warn'); return; }
  await loadData();
  state.checkpoints.push({ id:'cp_'+Date.now()+'_'+Math.random().toString(36).slice(2,7), name, lat, lng, radius, note });
  await saveCheckpoints();
  showToast(`Đã thêm trạm "${name}".`, 'ok');
  renderManager();
}

async function deleteCheckpoint(id){
  await loadData();
  state.checkpoints = state.checkpoints.filter(c=>c.id!==id);
  await saveCheckpoints();
  renderManager();
}

function exportCSV(){
  const rows = [['Thời gian','Mã NV','Tên','Trạm','Lệch (m)','Trạng thái','Vĩ độ','Kinh độ']];
  state.checkins.forEach(c=>{
    rows.push([fmtTime(c.timestamp), c.empCode, c.empName, c.checkpointName, c.distance, c.status==='ontime'?'Đúng vị trí':'Lệch vị trí', c.lat, c.lng]);
  });
  const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `checkin-baove-QNP-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

/* ================= APP LIFECYCLE ================= */
function logout(){
  if(state.pollHandle) clearInterval(state.pollHandle);
  state = { view:'login', role:null, empCode:'', empName:'', checkpoints:[], checkins:[], safetyCriteria:[], safetyInspections:[], loading:true, toast:null, pollHandle:null };
  renderLogin();
}

async function startApp(){
  await loadData();
  render();
  if(state.pollHandle) clearInterval(state.pollHandle);
  state.pollHandle = setInterval(async ()=>{
    const midEntry = state._manualFor || state._safetyOpenFor;
    if((state.view==='guard' || state.view==='manager' || state.view==='safety') && !midEntry){
      await loadData();
      render();
    }
  }, 7000);
}

function render(){
  if(state.view==='login') renderLogin();
  else if(state.view==='guard') renderGuard();
  else if(state.view==='safety') renderSafety();
  else if(state.view==='manager') renderManager();
}

renderLogin();
</script>
</body>
</html>
